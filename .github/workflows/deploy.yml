name: Build and Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  # Do not interrupt rsync while it is updating the live application.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    environment: production
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ vars.PROD_SSH_PORT }}

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify .NET 8
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sdkVersion = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $sdkVersion -notmatch '^8\.') {
            throw "The self-hosted runner requires .NET SDK 8.x; found '$sdkVersion'."
          }
          Write-Host "Using .NET SDK $sdkVersion"

      - name: Test inventory print queue and Windows helper
        shell: powershell
        run: |
          php scripts/inventory-issue-print-jobs-domain-test.php
          if ($LASTEXITCODE -ne 0) { throw "Inventory print domain tests failed" }
          php -l public/api/inventory-issues.php
          php -l public/api/inventory-issue-print-jobs.php
          php -l public/api/download-inventory-print-helper.php
          dotnet run --project agent/windows/InventoryPrintHelper.Tests/InventoryPrintHelper.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "Inventory Print Helper tests failed" }
          node --test src/app/download-inventory-print-helper/downloadConfig.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Inventory Print Helper download tests failed" }

      - name: Test print agent
        run: npm run test:bar-print-agent

      - name: Build production bundle
        run: npm run build

      - name: Validate deployment settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:SSH_HOST)) { throw "Missing production secret PROD_SSH_HOST" }
          if ([string]::IsNullOrWhiteSpace($env:SSH_USER)) { throw "Missing production secret PROD_SSH_USER" }
          if ([string]::IsNullOrWhiteSpace($env:SSH_PRIVATE_KEY)) { throw "Missing production secret PROD_SSH_PRIVATE_KEY" }
          if ([string]::IsNullOrWhiteSpace($env:SSH_KNOWN_HOSTS)) { throw "Missing production secret PROD_SSH_KNOWN_HOSTS" }

          if ($env:SSH_HOST -notmatch '^[a-zA-Z0-9._:-]+$') { throw "Invalid PROD_SSH_HOST" }
          if ($env:SSH_USER -notmatch '^[a-zA-Z0-9._-]+$') { throw "Invalid PROD_SSH_USER" }

          $effectivePort = if ([string]::IsNullOrWhiteSpace($env:SSH_PORT)) { 22 } else { $env:SSH_PORT }
          $parsedPort = 0
          if (-not [int]::TryParse($effectivePort, [ref]$parsedPort) -or $parsedPort -lt 1 -or $parsedPort -gt 65535) {
            throw "Invalid PROD_SSH_PORT"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SSH_PORT=$parsedPort"

      - name: Configure SSH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sshDirectory = Join-Path $env:RUNNER_TEMP "tncompany-ssh"
          $privateKeyPath = Join-Path $sshDirectory "id_ed25519"
          $knownHostsPath = Join-Path $sshDirectory "known_hosts"

          New-Item -ItemType Directory -Path $sshDirectory -Force | Out-Null
          [IO.File]::WriteAllText(
            $privateKeyPath,
            (($env:SSH_PRIVATE_KEY -replace "`r", "").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
            $knownHostsPath,
            (($env:SSH_KNOWN_HOSTS -replace "`r", "").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

          $runnerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $sshDirectory /inheritance:r /grant:r "*${runnerSid}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot secure the temporary SSH directory" }

          & ssh.exe -i $privateKeyPath -o IdentitiesOnly=yes -o BatchMode=yes `
            -o ConnectTimeout=10 -o "UserKnownHostsFile=$knownHostsPath" `
            -p $env:SSH_PORT "$env:SSH_USER@$env:SSH_HOST" "echo SSH_CONNECTION_OK"
          if ($LASTEXITCODE -ne 0) { throw "SSH connection failed with exit code $LASTEXITCODE" }

      - name: Package release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & tar.exe -C dist -czf "release-$env:GITHUB_SHA.tar.gz" .
          if ($LASTEXITCODE -ne 0) { throw "Cannot package production release" }

      - name: Upload and activate release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $sshDirectory = Join-Path $env:RUNNER_TEMP "tncompany-ssh"
          $privateKeyPath = Join-Path $sshDirectory "id_ed25519"
          $knownHostsPath = Join-Path $sshDirectory "known_hosts"
          $remoteArchive = "/tmp/tncompany-release-$env:GITHUB_SHA.tar.gz"
          $remoteScript = "/tmp/tncompany-deploy-$env:GITHUB_SHA.sh"
          $normalizedScript = Join-Path $env:RUNNER_TEMP "deploy-production.sh"
          $sshTarget = "$env:SSH_USER@$env:SSH_HOST"
          $sshOptions = @(
            "-i", $privateKeyPath,
            "-o", "IdentitiesOnly=yes",
            "-o", "BatchMode=yes",
            "-o", "UserKnownHostsFile=$knownHostsPath"
          )

          & scp.exe @sshOptions -P $env:SSH_PORT "release-$env:GITHUB_SHA.tar.gz" "${sshTarget}:$remoteArchive"
          if ($LASTEXITCODE -ne 0) { throw "Cannot upload release archive" }

          $scriptContent = [IO.File]::ReadAllText((Resolve-Path "deploy-production.sh"))
          $scriptContent = $scriptContent.Replace("`r`n", "`n").Replace("`r", "`n")
          [IO.File]::WriteAllText($normalizedScript, $scriptContent, [Text.UTF8Encoding]::new($false))

          & scp.exe @sshOptions -P $env:SSH_PORT $normalizedScript "${sshTarget}:$remoteScript"
          if ($LASTEXITCODE -ne 0) { throw "Cannot upload deployment script" }

          $remoteCommand = "chmod 700 '$remoteScript' && '$remoteScript' '$env:GITHUB_SHA' '$remoteArchive'"
          & ssh.exe @sshOptions -p $env:SSH_PORT $sshTarget $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw "Production activation failed" }

      - name: Verify public production endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $response = & curl.exe --fail --silent --show-error --retry 3 --retry-delay 2 `
            https://tnservice.vn/api/health.php
          if ($LASTEXITCODE -ne 0) { throw "Public production health request failed" }
          Write-Host $response
          if ($response -notmatch '"ok"\s*:\s*true') { throw "Unexpected production health response" }
