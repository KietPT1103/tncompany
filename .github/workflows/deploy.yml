name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    environment: FTP
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify checked out revision
        shell: powershell
        run: |
          Write-Host "github.sha: $env:GITHUB_SHA"
          git rev-parse HEAD
          git log -1 --oneline
          Write-Host "`n--- src/prerender/entry-server.jsx ---"
          Get-Content src\prerender\entry-server.jsx | Select-Object -First 20
          Write-Host "`n--- src/components/PublicSiteShell.jsx ---"
          Get-Content src\components\PublicSiteShell.jsx | Select-Object -First 60

      - name: Validate deploy settings
        id: deploy-settings
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER)) { throw "Missing GitHub secret: FTP_SERVER" }
          if ([string]::IsNullOrWhiteSpace($env:FTP_USERNAME)) { throw "Missing GitHub secret: FTP_USERNAME" }
          if ([string]::IsNullOrWhiteSpace($env:FTP_PASSWORD)) { throw "Missing GitHub secret: FTP_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:FTP_SERVER_DIR)) { throw "Missing GitHub variable: FTP_SERVER_DIR" }

          $ftpPort = if ([string]::IsNullOrWhiteSpace($env:FTP_PORT)) { "21" } else { $env:FTP_PORT }
          $ftpProtocol = if ([string]::IsNullOrWhiteSpace($env:FTP_PROTOCOL)) { "ftp" } else { $env:FTP_PROTOCOL }
          $ftpServerDir = $env:FTP_SERVER_DIR.TrimEnd("/") + "/"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "ftp_port=$ftpPort"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ftp_protocol=$ftpProtocol"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ftp_server_dir=$ftpServerDir"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy dist to DirectAdmin
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: ${{ steps.deploy-settings.outputs.ftp_port }}
          protocol: ${{ steps.deploy-settings.outputs.ftp_protocol }}
          local-dir: ./dist/
          server-dir: ${{ steps.deploy-settings.outputs.ftp_server_dir }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            api/config.local.php
            **/.env
            **/.env.*
            uploads/**
            deploy.php
            webhook.php
            test.php
